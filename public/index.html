<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini 3 Image Studio</title>
    <style>
        :root {
            --primary: #4285f4;
            --bg: #f8f9fa;
            --text: #202124;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            padding: 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-weight: 600;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input {
            flex: 1;
            padding: 12px 15px;
            border: 2px solid #dfe1e5;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus {
            border-color: var(--primary);
        }

        button {
            padding: 12px 20px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, background 0.3s;
        }

        button:hover {
            background-color: #357ae8;
            transform: translateY(-2px);
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #resultContainer {
            margin-top: 20px;
            min-height: 200px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px dashed #eee;
            border-radius: 15px;
            padding: 10px;
        }

        img {
            max-width: 100%;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: none;
        }

        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-msg {
            color: #d93025;
            font-size: 0.9rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Gemini 3 Artist</h1>
        
        <div class="input-group">
            <input type="text" id="promptInput" placeholder="Was soll ich generieren?">
            <button id="genBtn" onclick="generateImage()">Erstellen</button>
        </div>

        <div id="resultContainer">
            <div id="loader" class="loader"></div>
            <p id="statusMsg">Dein Kunstwerk erscheint hier...</p>
            <img id="outputImage" src="" alt="Generiertes Bild">
            <div id="errorBox" class="error-msg"></div>
        </div>
    </div>

    <script>
        async function generateImage() {
            const prompt = document.getElementById('promptInput').value;
            const btn = document.getElementById('genBtn');
            const loader = document.getElementById('loader');
            const statusMsg = document.getElementById('statusMsg');
            const img = document.getElementById('outputImage');
            const errorBox = document.getElementById('errorBox');

            if (!prompt) return;

            // UI Zustand: Laden
            btn.disabled = true;
            loader.style.display = 'block';
            statusMsg.innerText = "Gemini 3 zeichnet gerade...";
            img.style.display = 'none';
            errorBox.innerText = "";

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: prompt })
                });

                const data = await response.json();

                if (data.error) {
                    throw new Error(data.error);
                }

                // Fall 1: Wir erhalten Base64 Bilddaten (Gemini 3 Standard)
                if (data.imageBase64) {
                    img.src = `data:image/png;base64,${data.imageBase64}`;
                    img.style.display = 'block';
                    statusMsg.style.display = 'none';
                } 
                // Fall 2: Wir erhalten eine Textantwort/URL (Fallback)
                else if (data.result) {
                    statusMsg.innerText = "Antwort: " + data.result;
                }

            } catch (error) {
                console.error(error);
                errorBox.innerText = "Fehler: " + error.message;
                statusMsg.innerText = "Ups! Etwas ging schief.";
            } finally {
                btn.disabled = false;
                loader.style.display = 'none';
            }
        }
    </script>
</body>
</html>
